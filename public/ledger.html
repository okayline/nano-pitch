<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Pitch ledger</title>
<meta name="description" content="Every finished game of Pitch, on one hash chain.">
<meta name="theme-color" content="#0b0a12">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header><div class="title">THE LEDGER<small>Daily Pitch · one hash chain</small></div><span class="row" style="gap:14px"><a class="link" href="./">Back</a><a class="link" href="./#account">Account</a></span></header>
  <button class="go" id="check" type="button">Check the chain</button>
  <p class="hint" id="checked" role="status"></p>
  <ol class="entries" id="entries"></ol>
  <button class="ghost" id="more" type="button" hidden>Older entries</button>
  <div class="ver" id="ver"></div>
</div>
<script type="module" src="ledger.js"></script>
</body>
</html>
